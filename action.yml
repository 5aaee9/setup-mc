name: 'Setup Minio Client'
description: 'Setup the PGSTY-maintained MinIO/Silo client as mc and mcli on GitHub Actions'

branding:
  icon: 'play'
  color: 'blue'

inputs:
  version:
    description: 'PGSTY mc release timestamp (with or without RELEASE. prefix), or latest'
    required: false
    default: 'latest'
  github-token:
    description: 'GitHub token used to resolve PGSTY releases'
    required: false
    default: ${{ github.token }}

runs:
  using: 'node20'
  main: 'dist/index.js'
